name: Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run unit tests
        working-directory: ${{ matrix.project }}
        run: npm test -- --reporter=json --outputFile=test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: ${{ matrix.project }}/test-results.json
          if-no-files-found: warn
          retention-days: 7

  email-results:
    name: Email test results
    needs: test
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results

      - name: Create email report
        env:
          WORKFLOW_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: node .github/scripts/create-test-report.mjs

      - name: Send test results email
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ needs.test.result == 'success' && '[Team Todo] Unit tests passed' || '[Team Todo] Unit tests failed' }}
          to: oharuka27@gmail.com
          from: 'Team Todo CI <${{ secrets.MAIL_USERNAME }}>'
          html_body: file://test-report.html
